services:
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_ENVIRONMENT=${GP_ENVIRONMENT:-sandbox}
    networks:
      - disputes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/config"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nodejs:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_ENVIRONMENT=${GP_ENVIRONMENT:-sandbox}
    networks:
      - disputes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/config"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  dotnet:
    build:
      context: ./dotnet
      dockerfile: Dockerfile
    ports:
      - "8006:8000"
    environment:
      - ASPNETCORE_URLS=http://+:8000
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_ENVIRONMENT=${GP_ENVIRONMENT:-sandbox}
    networks:
      - disputes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/config"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  java:
    build:
      context: ./java
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    environment:
      - GP_APP_ID=${GP_APP_ID}
      - GP_APP_KEY=${GP_APP_KEY}
      - GP_ENVIRONMENT=${GP_ENVIRONMENT:-sandbox}
    networks:
      - disputes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/config"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  disputes:
    driver: bridge
